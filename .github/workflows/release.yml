name: Release

on:
  push:
    tags: ['v*']

env:
  PRODUCT_NAME: PDFA

jobs:
  build-mac:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PoDoFo
        run: brew install podofo

      - name: Build
        run: |
          cd PDFA
          mkdir cmake-build && cd cmake-build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Package
        run: |
          cd PDFA/PDFA-test/Plugins
          zip -r ${{ github.workspace }}/PDFA-macOS.zip PDFA.bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFA-macOS
          path: PDFA-macOS.zip

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg and PoDoFo
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install podofo:x64-windows

      - name: Build
        run: |
          cd PDFA
          mkdir cmake-build; cd cmake-build
          cmake .. -A x64 -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
          cmake --build . --config Release

      - name: Package
        run: |
          cd PDFA\PDFA-test\Plugins
          Compress-Archive -Path PDFA -DestinationPath ${{ github.workspace }}\PDFA-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFA-Windows
          path: PDFA-Windows.zip

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
      - id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  release:
    needs: [build-mac, build-windows, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            PDFA-macOS/PDFA-macOS.zip
            PDFA-Windows/PDFA-Windows.zip
