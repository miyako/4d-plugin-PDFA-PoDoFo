name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PRODUCT_NAME: PDFA

jobs:
  build-mac:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install PoDoFo
        run: brew install podofo

      - name: Build with CMake
        run: |
          cd PDFA
          mkdir cmake-build && cd cmake-build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .

      - name: Verify exports
        run: |
          nm -gU PDFA/cmake-build/PDFA.bundle/Contents/MacOS/PDFA | grep _PluginMain
          nm -gU PDFA/cmake-build/PDFA.bundle/Contents/MacOS/PDFA | grep _FourDPackex

      - name: Verify Resources
        run: |
          test -f PDFA/PDFA-test/Plugins/PDFA.bundle/Contents/Resources/manifest.json
          test -f PDFA/PDFA-test/Plugins/PDFA.bundle/Contents/Resources/sRGB.icc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFA-macOS
          path: PDFA/PDFA-test/Plugins/PDFA.bundle

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg and PoDoFo (static, /MT)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe install podofo:x64-windows-static-release --overlay-triplets="$env:GITHUB_WORKSPACE\vcpkg-triplets"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build with CMake
        shell: pwsh
        run: |
          cd PDFA
          mkdir cmake-build; cd cmake-build
          cmake .. -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\vcpkg-triplets"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build . --config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify DLL dependencies
        shell: pwsh
        run: ./.github/scripts/verify-windows-deps.ps1 -Dir PDFA/PDFA-test/Plugins/PDFA/Contents/Windows64 -Binary PDFA.4DX

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFA-Windows
          path: PDFA/PDFA-test/Plugins/PDFA/Contents/Windows64/
